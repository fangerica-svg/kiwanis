<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>淡水國際同濟會 第28屆 會務追蹤</title>
<style>
:root{
  --blue:#003974;--gold:#B8975B;--gold-d:#8C6F38;--gold-lt:#E7D4AC;
  --cream:#FAF2E0;--cream-2:#F3E6C9;--card:#FFFDF7;--line:#E8D9B8;
  --ink:#3B2E17;--ink-soft:#8A7855;
}
html{background:var(--cream);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:60px;
}
header{
  background:linear-gradient(180deg,var(--cream-2),var(--cream));
  position:sticky;top:0;z-index:20;padding:16px 16px 0;border-bottom:1px solid var(--gold-lt);
}
.brand{display:flex;align-items:center;gap:12px}
.seal{
  width:44px;height:44px;border-radius:50%;flex:0 0 44px;border:2.5px solid var(--gold);
  display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--blue);background:#FFF8E8;
}
.brand h1{font-size:17px;margin:0;font-weight:700;color:var(--blue);letter-spacing:.5px}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9BBF8F;margin-right:5px;vertical-align:1px}
.dot.off{background:#D08B7A}
.tabs{display:flex;margin-top:14px;gap:2px}
.tab{
  flex:1;text-align:center;padding:11px 4px 9px;border:0;cursor:pointer;background:transparent;
  color:var(--ink-soft);font-size:14.5px;font-weight:600;font-family:inherit;border-bottom:3px solid transparent;
}
.tab.on{color:var(--blue);border-bottom-color:var(--gold)}
.tab small{display:block;font-size:11px;font-weight:400;margin-top:2px;opacity:.85}

.wrap{max-width:720px;margin:0 auto;padding:14px 12px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar .big{font-size:22px;font-weight:800;color:var(--blue)}
.bar .lab{font-size:12.5px;color:var(--ink-soft)}
.track{height:8px;border-radius:99px;background:var(--cream-2);margin-top:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--gold-lt),var(--gold));width:0;transition:width .3s}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input[type=text],input[type=number],input[type=password]{
  font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);min-width:0;
}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{
  font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--blue);cursor:pointer;
}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#fff}
.search{flex:1}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{
  flex:1;font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 4px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;
}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lockbox{
  display:flex;gap:8px;align-items:center;margin-bottom:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;
}
.lockbox .txt{flex:1;font-size:13px;color:var(--ink-soft)}
.lockbox input{width:100px}

h2.grp{
  font-size:13.5px;letter-spacing:2px;color:var(--gold-d);margin:18px 4px 8px;
  display:flex;align-items:center;gap:8px;font-weight:700;
}
h2.grp::after{content:"";flex:1;height:1px;background:var(--gold-lt)}
h2.grp em{font-style:normal;font-size:12px;color:var(--gold-d);opacity:.75;letter-spacing:0}

.item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  margin-bottom:8px;display:flex;align-items:center;gap:12px;
}
.item.done{border-color:var(--gold);background:#FBF1DC}
.who{flex:1;min-width:0}
.who .name{font-size:16.5px;font-weight:600;color:var(--blue)}
.who .title{font-size:12px;color:var(--ink-soft);margin-top:1px}
.chk{
  width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:2px solid var(--gold-lt);
  background:#fff;cursor:pointer;display:grid;place-items:center;font-size:19px;color:transparent;font-weight:800;
}
.chk.on{background:var(--gold);border-color:var(--gold-d);color:#fff}
.chk.ro{cursor:default;border-style:dashed}
.chk.ro.on{border-style:solid;opacity:.85}
.money{width:100px;flex:0 0 100px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.money::-webkit-outer-spin-button,.money::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.moneyRO{width:100px;flex:0 0 100px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-soft)}
.empty{
  background:var(--card);border:1px dashed var(--gold);border-radius:12px;padding:26px 16px;
  text-align:center;color:var(--ink-soft);font-size:14.5px;
}
.foot{text-align:center;font-size:12px;color:var(--ink-soft);padding:24px 12px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--blue);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.gate{
  position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#F3E6C9,#FAF2E0);
  display:grid;place-items:center;padding:24px;
}
.gate .box{width:100%;max-width:320px;text-align:center}
.gate .seal{width:76px;height:76px;font-size:38px;margin:0 auto 18px;border-width:3px}
.gate h2{font-size:21px;color:var(--blue);margin:0 0 4px;font-weight:700}
.gate p{font-size:13px;color:var(--ink-soft);margin:0 0 22px}
.gate input{width:100%;text-align:center;font-size:17px;padding:13px;letter-spacing:4px;margin-bottom:10px}
.gate button{width:100%;padding:13px;font-size:16px}
.gate .err{font-size:13px;color:#B4453A;height:18px;margin-top:8px}

/* ── 會費卡片 ── */
.fcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold-lt);
  border-radius:12px;padding:11px 13px;margin-bottom:9px}
.fcard.s-done{border-left-color:var(--gold);background:#FBF1DC}
.fcard.s-part{border-left-color:#D9A441;background:#FDF6E6}
.fcard.s-none{border-left-color:var(--gold-lt)}
.fhead{display:flex;align-items:flex-start;gap:10px}
.fhead .who{flex:1;min-width:0}
.stamp{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
  border:1px solid var(--gold-lt);color:var(--ink-soft);background:#fff;white-space:nowrap}
.stamp.done{background:var(--gold);border-color:var(--gold-d);color:#fff}
.stamp.part{background:#F6E3B8;border-color:#D9A441;color:#7A5A15}
.frows{margin-top:8px;border-top:1px dashed var(--gold-lt);padding-top:7px}
.frow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:2px 0;
  font-variant-numeric:tabular-nums}
.frow .fl{flex:0 0 76px;color:var(--ink-soft);font-size:12.5px}
.frow .fd,.frow .fg{flex:1;text-align:right}
.frow .fd{color:var(--ink-soft)}
.frow .fg{font-weight:700;color:var(--blue)}
.frow .fg.short{color:#B4453A}
.frow .fg.zero{color:var(--ink-soft);font-weight:400}
.frow .mk{flex:0 0 20px;text-align:center;font-weight:800;color:var(--gold-d)}
.frow .mk.off{color:var(--gold-lt)}
.fhint{display:flex;gap:8px;font-size:11px;color:var(--ink-soft);padding:0 0 3px}
.fhint .fl{flex:0 0 76px}
.fhint span:not(.fl){flex:1;text-align:right}
.frow input.mi{width:100%;flex:1;text-align:right;font-size:14px;padding:5px 7px;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.frow input.mi::-webkit-outer-spin-button,.frow input.mi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ffoot{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:8px;border-top:1px dashed var(--gold-lt);padding-top:7px;font-size:12px}
.ffoot .when{color:var(--gold-d);font-weight:600}
.ffoot .when.no{color:var(--ink-soft);font-weight:400}
.ffoot .sum{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ffoot .sum b{color:var(--blue);font-size:14px}
.ffoot input.di{width:86px;text-align:center;font-size:13px;padding:5px 6px}
@media print{header{position:static}.tools,.chips,.lockbox,.btn,.toast{display:none}body{background:#fff;padding:0}}
</style>
</head>
<body>

<header>
  <div class="brand">

    <div>

</div>

<div class="gate" id="gate">
  <div class="box">
    <div class="seal">K</div>
    <h2>淡水國際同濟會</h2>

    <input type="password" id="gpw" inputmode="numeric" placeholder="輸入密碼" autocomplete="off">
    <button class="btn gold" id="goBtn">開啟</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://hhnbymkhpthdnbhtxlsx.supabase.co";
const TABLE="kiwanis_members";
// 金鑰以密碼加密後存放，密碼不出現在原始碼中
const VA={s:"NxMONceSWTBeHdZ2PQro8g==",i:"vJiOblCm2hWt/jrr",
  c:"nDCPvqTUZUJEUt/K0SGuQfpaqqTz5IWimP2mglPSWp5E/B6o+wTjYPwvnZvW+jC12FUCoxwhrYqW1QNIOuE=",n:250000};
const VB={s:"9mBywGc8A/0oJhc6PykMmA==",i:"kPs54i9/LJxFQGCc",
  c:"ChrcgmtAwij32TDOm0S6GgplS/fXjuwcc4ef1RRkETM=",n:250000};
let db=null;

const b64=t=>Uint8Array.from(atob(t),ch=>ch.charCodeAt(0));
async function openVault(pass,V){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(V.s),iterations:V.n,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(V.i)},key,b64(V.c));
  return new TextDecoder().decode(out);
}

const SEED=[
 ["幹部","會長","李益欽",1,1],["幹部","前任會長","潘文進",1,1],["幹部","候任會長","連政凱",1,1],
 ["幹部","副會長","林永龍",1,1],["幹部","副會長","王治政",1,1],["幹部","理事","張鈞霖",1,1],
 ["幹部","理事","陳國華",1,1],["幹部","理事","陳志成",0,0],["幹部","理事","黃自強",1,1],
 ["幹部","常務監事","呂承男",1,1],["幹部","監事","杜凱恩",1,1],["幹部","監事","紀傑元",1,1],
 ["幹部","法制顧問","陳福音",1,1],["幹部","秘書長","方思喻",1,1],["幹部","財務長","黃錦紹",1,1],
 ["幹部","第26屆會長","曾健瑞",1,1],
 ["歷屆會長","創會長","謝安棋",1,1],["歷屆會長","第4屆會長","盧忠義",1,1],["歷屆會長","第6屆會長","林勝弘",1,1],
 ["歷屆會長","第7屆會長","盧金龍",1,1],["歷屆會長","第9屆會長","李建勝",1,1],["歷屆會長","第10屆會長","周清源",1,1],
 ["歷屆會長","第12屆會長","林國峯",1,1],["歷屆會長","第13屆會長","陳銘志",1,1],["歷屆會長","第14屆會長","陳煌林",0,0],
 ["歷屆會長","第15屆會長","謝仲信",1,1],["歷屆會長","第16屆會長","許春敏",1,1],["歷屆會長","第18屆會長","王燦煌",1,1],
 ["歷屆會長","第19屆會長","魏培文",1,1],["歷屆會長","第21屆會長","許隆華",1,1],["歷屆會長","第22屆會長","郭丁木",1,1],
 ["歷屆會長","第24屆會長","盧春林",1,1],["歷屆會長","第25屆會長","游閔勇",1,1],
 ["會兄","會兄","盧進財",0,1],["會兄","會兄","吳德銘",1,1],["會兄","會兄","紀景元",1,1],
 ["會兄","會兄","黃梓榮",1,1],["會兄","會兄","周文烈",0,0],["會兄","會兄","陳文肯",0,0],
 ["會兄","會兄","盧武揚",0,0],["會兄","會兄","林峻賢",1,1],["會兄","會兄","陳昆伸",0,0],
 ["會兄","會兄","曾鈺澤",0,0],["會兄","會兄","林正偉",0,0],["會兄","會兄","王嘉偉",1,1],
 ["會兄","會兄","施嘉鎮",1,0],["會兄","會兄","吳培協",0,0],["會兄","會兄","楊聰賓",1,1],
 ["會兄","會兄","黃呈達",0,0],["會兄","新會員","林政德",0,0]
];


/* ── 會費：多項目收款 ── */
const FITEM=[["fee","常年會費"],["fund","基金"],["duty","職務捐款"],["newm","新會員費"]];
const nz=v=>+v||0;
function fdue(m){return FITEM.reduce((s,it)=>s+nz(m[it[0]+"_due"]),0);}
function fgot(m){return FITEM.reduce((s,it)=>s+nz(m[it[0]+"_got"]),0);}
function fstate(m){const d=fdue(m),g=fgot(m);
  if(d>0&&g>=d)return "done";
  if(g>0)return "part";
  return "none";}
const nfmt=n=>nz(n).toLocaleString("en-US");
function dfmt(v){v=(v||"").toString().trim();
  if(!/^\d{3,4}$/.test(v))return "";
  v=v.padStart(4,"0");
  return (+v.slice(0,2))+"/"+v.slice(2);}

let M=[],tab="fee",filt="all";
let unlocked=false;
const WORD={fee:{todo:"未繳",part:"部分繳",done:"已繳清",list:"尚未繳交會費"},
            tie:{todo:"未領",done:"已領",list:"尚未領取領帶"},
            award:{todo:"未領",done:"已領",list:"尚未領取敘獎禮品"}};

function conn(t,ok){document.getElementById("conn").textContent=t;
  document.getElementById("dot").className="dot"+(ok?"":" off");}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1600);}

async function boot(){
  try{
    let {data,error}=await db.from(TABLE).select("*").order("sort_no");
    if(error)throw error;
    if(!data||!data.length){
      conn("首次建立名單…",true);
      const rows=SEED.map((r,i)=>({sort_no:i+1,grp:r[0],title:r[1],name:r[2],
        fee_amount:0,fee_paid:false,tie_received:!!r[3],award_received:!!r[4]}));
      const ins=await db.from(TABLE).insert(rows);
      if(ins.error)throw ins.error;
      const re=await db.from(TABLE).select("*").order("sort_no");
      data=re.data;
    }
    M=data;
    conn("已連線・即時同步",true);
    db.channel("kiwanis").on("postgres_changes",
      {event:"*",schema:"public",table:TABLE},payload=>{
        const r=payload.new;if(!r)return;
        const i=M.findIndex(x=>x.id===r.id);
        if(i>=0)M[i]=r;else M.push(r);
        M.sort((a,b)=>a.sort_no-b.sort_no);render();
      }).subscribe();
    render();
  }catch(e){
    conn("連線失敗，請檢查網路或後台設定",false);
    document.getElementById("list").innerHTML=
      '<div class="empty">讀不到資料：'+(e.message||e)+'</div>';
  }
}

async function push(row,patch){
  Object.assign(row,patch);render();
  const {error}=await db.from(TABLE).update(
    Object.assign({},patch,{updated_at:new Date().toISOString()})).eq("id",row.id);
  if(error)toast("儲存失敗，請重試");
}

function done(m){
  return tab==="fee"?(fstate(m)==="done"):(tab==="tie"?m.tie_received:m.award_received);
}
function matchFilt(m){
  if(filt==="all")return true;
  if(tab!=="fee")return filt==="done"?done(m):!done(m);
  const st=fstate(m);
  return filt==="done"?st==="done":(filt==="part"?st==="part":st==="none");
}
function toggle(m){
  const k=tab==="fee"?"fee_paid":(tab==="tie"?"tie_received":"award_received");
  push(m,{[k]:!m[k]});
}

const timers={};
function setF(m,field,v){
  m[field]=v===""?0:+v;
  const patch={};patch[field]=m[field];
  patch.fee_amount=fdue(m);
  patch.fee_paid=fstate(m)==="done";
  m.fee_amount=patch.fee_amount;m.fee_paid=patch.fee_paid;
  stats();
  clearTimeout(timers[m.id+field]);
  timers[m.id+field]=setTimeout(()=>push(m,patch),600);
}
function setDate(m,v){
  v=(v||"").replace(/\D/g,"").slice(0,4);
  m.pay_date=v||null;
  clearTimeout(timers[m.id+"d"]);
  timers[m.id+"d"]=setTimeout(()=>push(m,{pay_date:m.pay_date}),600);
}
function feeCard(m){
  const st=fstate(m),due=fdue(m),got=fgot(m);
  const el=document.createElement("div");
  el.className="fcard s-"+st;
  const lab=st==="done"?"已繳清":(st==="part"?"部分繳":"未繳");
  const head=document.createElement("div");head.className="fhead";
  head.innerHTML='<div class="who"><div class="name">'+m.name+'</div>'+
    '<div class="title">'+(m.title||"")+'</div></div>'+
    '<span class="stamp '+(st==="none"?"":st)+'">'+lab+'</span>';
  el.appendChild(head);

  const rows=document.createElement("div");rows.className="frows";
  if(unlocked){
    const hint=document.createElement("div");hint.className="fhint";
    hint.innerHTML='<span class="fl"></span><span>應繳</span><span>已繳</span>';
    rows.appendChild(hint);
  }
  FITEM.forEach(([k,name])=>{
    const d=nz(m[k+"_due"]),g=nz(m[k+"_got"]);
    if(!unlocked&&!d&&!g)return;
    const row=document.createElement("div");row.className="frow";
    const l=document.createElement("span");l.className="fl";l.textContent=name;row.appendChild(l);
    if(unlocked){
      [[k+"_due",d],[k+"_got",g]].forEach(([f,v])=>{
        const inp=document.createElement("input");
        inp.type="number";inp.className="mi";inp.step="100";inp.placeholder="0";
        inp.value=v||"";inp.oninput=()=>setF(m,f,inp.value);
        row.appendChild(inp);
      });
    }else{
      const a=document.createElement("span");a.className="fd";a.textContent=nfmt(d);
      const b=document.createElement("span");
      b.className="fg"+(g>=d&&d>0?"":(g>0?" short":" zero"));
      b.textContent=g?nfmt(g):"—";
      const c=document.createElement("span");
      c.className="mk"+(d>0&&g>=d?"":" off");c.textContent=d>0&&g>=d?"✓":"○";
      row.appendChild(a);row.appendChild(b);row.appendChild(c);
    }
    rows.appendChild(row);
  });
  el.appendChild(rows);

  const foot=document.createElement("div");foot.className="ffoot";
  if(unlocked){
    const wrap=document.createElement("span");
    wrap.innerHTML='<span class="when no">入帳日期</span> ';
    const di=document.createElement("input");
    di.type="text";di.className="di";di.inputMode="numeric";di.maxLength=4;
    di.placeholder="0811";di.value=m.pay_date||"";
    di.oninput=()=>setDate(m,di.value);
    wrap.appendChild(di);foot.appendChild(wrap);
  }else{
    const w=document.createElement("span");
    const t=dfmt(m.pay_date);
    w.className="when"+(t?"":" no");
    w.textContent=t?t+" 入帳":"尚未入帳";
    foot.appendChild(w);
  }
  const sum=document.createElement("span");sum.className="sum";
  sum.innerHTML='已繳 <b>$'+nfmt(got)+'</b> ／ 應繳 $'+nfmt(due);
  foot.appendChild(sum);
  el.appendChild(foot);
  return el;
}

function render(){
  const q=document.getElementById("q").value.trim();
  const w=WORD[tab];
  const isFeeTab=tab==="fee";
  document.getElementById("chipTodo").textContent=w.todo;
  document.getElementById("chipDone").textContent=w.done;
  document.getElementById("chipPart").style.display=isFeeTab?"block":"none";
  if(!isFeeTab&&filt==="part"){filt="all";
    document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.f==="all"));}
  document.getElementById("copyBtn").textContent=filt==="done"?"複製已完成":"複製未完成";

  const isFee=tab==="fee";
  document.getElementById("lockbox").style.display="flex";
  document.getElementById("lockTxt").textContent=unlocked?"編輯模式・可打勾與改金額":"檢視模式・輸入密碼可編輯";
  document.getElementById("pw").style.display=unlocked?"none":"block";
  document.getElementById("unlockBtn").style.display=unlocked?"none":"block";
  document.getElementById("lockBtn").style.display=unlocked?"block":"none";

  const list=document.getElementById("list");list.innerHTML="";
  let shown=0;
  ["幹部","歷屆會長","會兄"].forEach(g=>{
    const all=M.filter(m=>m.grp===g);
    const rows=all.filter(m=>(!q||(m.name||"").includes(q)||(m.title||"").includes(q))
      &&matchFilt(m));
    if(!rows.length)return;
    shown+=rows.length;
    const h=document.createElement("h2");h.className="grp";
    h.innerHTML=g+' <em>'+(filt==="all"?all.filter(done).length+' / '+all.length:rows.length+' 人')+'</em>';
    list.appendChild(h);
    rows.forEach(m=>{
      if(isFee){list.appendChild(feeCard(m));return;}
      const d=done(m);
      const el=document.createElement("div");el.className="item"+(d?" done":"");
      el.innerHTML='<div class="who"><div class="name">'+m.name+'</div><div class="title">'+m.title+'</div></div>';
      const b=document.createElement("button");
      b.className="chk"+(d?" on":"");b.textContent="✓";
      b.setAttribute("aria-label",m.name+(d?" 已完成":" 未完成"));
      if(unlocked){b.onclick=()=>toggle(m);}
      else{b.classList.add("ro");b.onclick=()=>toast("需輸入編輯密碼才能修改");}
      el.appendChild(b);
      list.appendChild(el);
    });
  });
  if(!shown){
    const e=document.createElement("div");e.className="empty";
    e.textContent=q?"找不到「"+q+"」":
      (filt==="todo"?"全部都完成了 🎉":(filt==="part"?"沒有部分繳款的會兄":"目前還沒有人完成"));
    list.appendChild(e);
  }
  stats();
}

function stats(){
  const N=M.length||1;
  const t1=M.filter(m=>fstate(m)==="done").length,t2=M.filter(m=>m.tie_received).length,t3=M.filter(m=>m.award_received).length;
  document.getElementById("tb1").textContent=t1+"/"+M.length;
  document.getElementById("tb2").textContent=t2+"/"+M.length;
  document.getElementById("tb3").textContent=t3+"/"+M.length;
  let n,lab;
  if(tab==="fee"){
    n=t1;
    if(unlocked){
      const due=M.reduce((s,m)=>s+fdue(m),0),got=M.reduce((s,m)=>s+fgot(m),0);
      lab="應收 $"+nfmt(due)+"　已收 $"+nfmt(got)+"　未收 $"+nfmt(due-got);
    }else{
      const part=M.filter(m=>fstate(m)==="part").length;
      lab="已繳清人數"+(part?"（另有 "+part+" 位部分繳）":"");
    }
  }else if(tab==="tie"){n=t2;lab="已領取領帶";}
  else{n=t3;lab="已領取敘獎禮品";}
  document.getElementById("statLab").textContent=lab;
  document.getElementById("statBig").textContent=n+" / "+M.length+" 人";
  document.getElementById("fill").style.width=(n/N*100)+"%";
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");tab=b.dataset.tab;render();
});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");filt=b.dataset.f;render();
});
document.getElementById("q").oninput=render;
document.getElementById("copyBtn").onclick=()=>{
  const w=WORD[tab],wantDone=filt==="done";
  let sel,head;
  if(tab==="fee"&&filt==="part"){
    sel=M.filter(m=>fstate(m)==="part");head="【會費部分繳交】";
  }else if(tab==="fee"&&!wantDone){
    sel=M.filter(m=>fstate(m)==="none");head="【"+w.list+"】";
  }else{
    sel=M.filter(m=>wantDone?done(m):!done(m));
    head=wantDone?"【已完成："+w.list.replace("尚未","")+"】":"【"+w.list+"】";
  }
  const rows=sel.map(m=>{
    if(tab!=="fee")return "・"+m.name+"（"+m.title+"）";
    const d=fdue(m),g=fgot(m);
    if(!unlocked)return "・"+m.name+"（"+m.title+"）";
    return "・"+m.name+"（"+m.title+"）"+(fstate(m)==="part"
      ?" 已繳 $"+nfmt(g)+"／應繳 $"+nfmt(d)+"，尚差 $"+nfmt(d-g)
      :" 應繳 $"+nfmt(d));
  });
  navigator.clipboard.writeText(head+"共 "+rows.length+" 人\n"+rows.join("\n"))
    .then(()=>toast("已複製 "+rows.length+" 人"),()=>toast("複製失敗，請長按選取"));
};
document.getElementById("csvBtn").onclick=()=>{
  const st={done:"已繳清",part:"部分繳",none:"未繳"};
  let c="\uFEFF職稱,姓名,繳費狀態,入帳日期";
  if(unlocked)c+=",常年會費應繳,常年會費已繳,基金應繳,基金已繳,職務捐款應繳,職務捐款已繳,新會員費應繳,新會員費已繳,合計應繳,合計已繳";
  c+=",領帶已領,敘獎已領\n";
  M.forEach(m=>{
    const a=[m.title,m.name,st[fstate(m)],dfmt(m.pay_date)];
    if(unlocked){
      FITEM.forEach(([k])=>{a.push(nz(m[k+"_due"]),nz(m[k+"_got"]));});
      a.push(fdue(m),fgot(m));
    }
    a.push(m.tie_received?"V":"",m.award_received?"V":"");
    c+=a.join(",")+"\n";});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));
  a.download="同濟會第28屆_會務追蹤.csv";a.click();toast("已匯出 CSV");
};
async function tryUnlock(){
  const el=document.getElementById("pw");
  if(!el.value)return;
  try{
    await openVault(el.value,VB);
    unlocked=true;el.value="";render();toast("已進入編輯模式");
  }catch(e){el.value="";toast("密碼錯誤");}
}
document.getElementById("unlockBtn").onclick=tryUnlock;
document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")tryUnlock();};
document.getElementById("lockBtn").onclick=()=>{unlocked=false;render();toast("已回到檢視模式");};

async function signIn(){
  const el=document.getElementById("gpw"),err=document.getElementById("gerr"),btn=document.getElementById("goBtn");
  if(!el.value){err.textContent="請輸入密碼";return;}
  btn.disabled=true;btn.textContent="開啟中…";err.textContent="";
  try{
    const key=await openVault(el.value,VA);
    db=supabase.createClient(SB_URL,key);
    document.getElementById("gate").style.display="none";
    boot();
  }catch(e){
    err.textContent="密碼錯誤";el.value="";
  }
  btn.disabled=false;btn.textContent="開啟";
}
document.getElementById("goBtn").onclick=signIn;
document.getElementById("gpw").onkeydown=e=>{if(e.key==="Enter")signIn();};
document.getElementById("gpw").focus();
</script>
</body>
</html>
