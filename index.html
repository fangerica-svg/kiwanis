<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代墊記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#67D5B5;
  --deep:#26705F;
  --deeper:#17453A;
  --coral:#EE7785;
  --coral-soft:#FDECEE;
  --taro:#C89EC4;
  --sky:#84B1ED;
  --paper:#FFFDF8;
  --wash:#EAF6F1;
  --line:#CFE6DD;
  --ink:#274740;
  --ink-soft:#5C7C74;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  background:var(--wash);
  color:var(--ink);
  line-height:1.6;
  padding-bottom:96px;
}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- 密碼閘 ---------- */
#gate{
  position:fixed;inset:0;z-index:100;
  background:linear-gradient(170deg,var(--deep),var(--deeper));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
#gate .box{width:100%;max-width:320px;text-align:center;color:#fff}
#gate h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:.08em}
#gate p{margin:0 0 28px;color:var(--mint);font-size:14px;letter-spacing:.05em}
#gate .clip{
  width:64px;height:64px;margin:0 auto 20px;border-radius:50%;
  background:var(--mint);display:flex;align-items:center;justify-content:center;
  font-size:30px;
}
#pass{
  width:100%;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);color:#fff;text-align:center;
  font-size:22px;letter-spacing:.6em;font-family:"Roboto Mono",monospace;
}
#pass::placeholder{color:rgba(255,255,255,.4);letter-spacing:.2em;font-size:15px}
#gate button{
  margin-top:14px;width:100%;padding:14px;border-radius:12px;
  background:var(--mint);color:var(--deeper);font-weight:700;font-size:16px;
}
#gateErr{min-height:22px;margin-top:12px;color:var(--coral);font-size:14px}

/* ---------- 頂部統計 ---------- */
header{
  background:linear-gradient(165deg,var(--deep),var(--deeper));
  color:#fff;padding:22px 0 26px;border-radius:0 0 26px 26px;
}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand h1{font-size:17px;font-weight:500;margin:0;letter-spacing:.14em;color:var(--mint)}
.brand button{font-size:13px;color:rgba(255,255,255,.65);padding:4px 8px}
.big-label{font-size:13px;color:var(--mint);letter-spacing:.12em;margin-bottom:2px}
.big-amt{font-size:38px;font-weight:700;line-height:1.15}
.big-amt small{font-size:18px;font-weight:400;margin-right:4px;opacity:.7}
.sub-row{display:flex;gap:26px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.sub-row div{flex:1}
.sub-label{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.08em}
.sub-val{font-size:19px;font-weight:500}

/* ---------- 篩選 ---------- */
.tools{display:flex;gap:8px;margin:16px 0 4px}
.tools input,.tools select{
  padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);
}
#q{flex:1;min-width:0}
#month{flex:0 0 auto}
.chips{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}
.chip{
  padding:6px 13px;border-radius:999px;font-size:13px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);
}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

/* ---------- 票根卡 ---------- */
.stub{
  position:relative;background:var(--paper);border-radius:14px;
  margin-bottom:12px;padding:14px 16px 14px 20px;
  box-shadow:0 1px 0 var(--line),0 6px 14px rgba(38,112,95,.07);
  border-left:6px solid var(--coral);overflow:hidden;
}
.stub.paid{border-left-color:var(--mint)}
.stub::after{
  content:"";position:absolute;left:6px;top:0;bottom:0;width:9px;
  background-image:radial-gradient(circle at 0 5px,var(--wash) 4px,transparent 4.5px);
  background-size:9px 14px;
}
.stub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stub-date{font-size:12.5px;color:var(--ink-soft);letter-spacing:.05em}
.stub-item{font-size:16.5px;font-weight:500;margin-top:1px;word-break:break-all}
.stub-note{font-size:13px;color:var(--ink-soft);margin-top:2px;word-break:break-all}
.stub-amt{font-size:20px;font-weight:700;white-space:nowrap}
.stub-bot{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:13px;
  padding:6px 11px;border-radius:9px;border:1.5px solid var(--line);color:var(--ink-soft);
}
.tag.recp{border-color:var(--taro);color:#8E5F8A;background:#F8F1F7}
.tag.pay{border-color:var(--coral);color:#C2455A;background:var(--coral-soft)}
.tag.pay.on{border-color:var(--mint);color:var(--deep);background:#E6F7F1}
.tag.edit{margin-left:auto;border-style:dashed}
.stamp{
  position:absolute;right:14px;bottom:8px;transform:rotate(-13deg);
  border:2.5px solid var(--mint);color:var(--mint);border-radius:50%;
  width:66px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.5;pointer-events:none;
}
.stamp span{font-size:9px;font-weight:400;letter-spacing:0}

.mgroup{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.mgroup h2{font-size:14px;margin:0;letter-spacing:.1em;color:var(--deep)}
.mgroup em{font-style:normal;font-size:13px;color:var(--ink-soft)}
.mgroup hr{flex:1;border:none;border-top:1.5px dashed var(--line)}

.empty{text-align:center;padding:56px 20px;color:var(--ink-soft)}
.empty div:first-child{font-size:40px;margin-bottom:10px}

/* ---------- 新增鈕 ---------- */
#fab{
  position:fixed;right:max(18px,calc(50vw - 302px));bottom:24px;z-index:40;
  background:var(--coral);color:#fff;font-size:16px;font-weight:700;
  padding:15px 24px;border-radius:999px;box-shadow:0 8px 22px rgba(238,119,133,.45);
}

/* ---------- 表單 ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(23,69,58,.45)}
#sheet .card{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;
  background:var(--paper);border-radius:22px 22px 0 0;padding:20px 18px 30px;
  max-width:640px;margin:0 auto;animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){#sheet .card{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-head h2{font-size:18px;margin:0;letter-spacing:.06em}
.sheet-head button{font-size:15px;color:var(--ink-soft);padding:4px 8px}
label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px;letter-spacing:.06em}
.fld{
  width:100%;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);
}
.fld:focus,.chip:focus-visible,button:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
#f_amount{font-family:"Roboto Mono",monospace;font-size:20px;font-weight:700}
.rowck{display:flex;align-items:center;gap:10px;margin-top:18px;padding:13px 14px;border-radius:12px;background:var(--wash)}
.rowck input{width:22px;height:22px;accent-color:var(--deep)}
.rowck label{margin:0;font-size:15px;color:var(--ink)}
#drop{
  border:2px dashed var(--taro);border-radius:12px;padding:16px;text-align:center;
  color:#8E5F8A;background:#FBF6FA;font-size:14px;
}
#prev{margin-top:10px;display:none}
#prev img{width:100%;border-radius:12px;border:1.5px solid var(--line)}
#prev button{font-size:13px;color:var(--coral);margin-top:6px}
.acts{display:flex;gap:10px;margin-top:24px}
.btn-main{flex:1;padding:15px;border-radius:13px;background:var(--deep);color:#fff;font-weight:700;font-size:16px}
.btn-del{padding:15px 18px;border-radius:13px;background:var(--coral-soft);color:#C2455A;font-weight:500}
.btn-main:disabled{opacity:.55}

#viewer{position:fixed;inset:0;z-index:80;background:rgba(23,69,58,.9);display:none;align-items:center;justify-content:center;padding:16px}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:86vh;border-radius:12px}
#viewer button{position:absolute;top:16px;right:18px;color:#fff;font-size:26px;padding:6px 12px}

#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;
  background:var(--deeper);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;
}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="clip">🧾</div>
    <h1>代墊記帳本</h1>
    <p>出過的帳，一筆都不會忘</p>
    <input id="pass" type="password" inputmode="numeric" placeholder="輸入密碼" autocomplete="off">
    <button id="gateBtn">開啟</button>
    <div id="gateErr"></div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>代墊記帳本</h1>
      <button id="lock">鎖上</button>
    </div>
    <div class="big-label">尚未請款</div>
    <div class="big-amt mono"><small>NT$</small><span id="unpaid">0</span></div>
    <div class="sub-row">
      <div>
        <div class="sub-label" id="mLabel">本月支出</div>
        <div class="sub-val mono">NT$<span id="mTotal">0</span></div>
      </div>
      <div>
        <div class="sub-label">未請款筆數</div>
        <div class="sub-val mono"><span id="unpaidN">0</span> 筆</div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋內容…">
    <select id="month"></select>
  </div>
  <div class="chips">
    <button class="chip" id="cAll" aria-pressed="true">全部</button>
    <button class="chip" id="cUnpaid" aria-pressed="false">只看未請款</button>
    <button class="chip" id="cRecp" aria-pressed="false">有收據</button>
  </div>
  <div id="list"><div class="empty"><div>⏳</div><div>載入中…</div></div></div>
</main>

<button id="fab">＋ 記一筆</button>

<div id="sheet">
  <div class="bg" data-close></div>
  <div class="card">
    <div class="sheet-head">
      <h2 id="sheetTitle">記一筆</h2>
      <button data-close>關閉</button>
    </div>
    <label for="f_date">年月日</label>
    <input id="f_date" class="fld" type="date">
    <label for="f_item">內容</label>
    <input id="f_item" class="fld" type="text" placeholder="例：買茶水招待客戶">
    <label for="f_amount">金額</label>
    <input id="f_amount" class="fld" type="number" inputmode="decimal" placeholder="0">
    <label for="f_note">備註（可不填）</label>
    <input id="f_note" class="fld" type="text" placeholder="例：先跟出納報備過">
    <label>收據</label>
    <div id="drop">📷 點這裡拍照或選圖片</div>
    <input id="f_file" type="file" accept="image/*" hidden>
    <div id="prev"><img id="prevImg" alt="收據預覽"><button type="button" id="rmImg">移除這張收據</button></div>
    <div class="rowck">
      <input id="f_claimed" type="checkbox">
      <label for="f_claimed">已請款</label>
    </div>
    <div class="acts">
      <button class="btn-main" id="save">儲存</button>
      <button class="btn-del" id="del" style="display:none">刪除</button>
    </div>
  </div>
</div>

<div id="viewer"><button id="vClose">✕</button><img id="vImg" alt="收據"></div>
<div id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ============ 設定：密碼改這一行 ============ */
const PASSCODE = "1234";
const SUPABASE_URL = "https://hhnbymkhpthdnbhtxlsx.supabase.co";
const SUPABASE_KEY = "sb_publishable_kTQT2AaMHZf4tKNbfdVjEA_hQFuwaCi";
/* =========================================== */

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const nt = n => Math.round(Number(n) || 0).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let rows = [], editing = null, pendingFile = null, removeReceipt = false;
let filter = "all";

/* ---------- 密碼閘 ---------- */
const openApp = () => { $("gate").style.display = "none"; load(); };
$("gateBtn").onclick = () => {
  if ($("pass").value.trim() === PASSCODE) { localStorage.setItem("bk_ok", "1"); openApp(); }
  else { $("gateErr").textContent = "密碼不對，再試一次"; $("pass").value = ""; }
};
$("pass").onkeydown = e => { if (e.key === "Enter") $("gateBtn").click(); };
$("lock").onclick = () => { localStorage.removeItem("bk_ok"); location.reload(); };
if (localStorage.getItem("bk_ok") === "1") openApp(); else $("pass").focus();

/* ---------- 讀取 ---------- */
async function load() {
  const { data, error } = await sb.from("expenses").select("*")
    .order("spend_date", { ascending: false }).order("created_at", { ascending: false });
  if (error) {
    $("list").innerHTML = `<div class="empty"><div>⚠️</div><div>連不上後台：${esc(error.message)}</div></div>`;
    return;
  }
  rows = data || [];
  buildMonths();
  render();
}

function buildMonths() {
  const set = [...new Set(rows.map(r => r.spend_date.slice(0, 7)))].sort().reverse();
  const cur = $("month").value;
  $("month").innerHTML = `<option value="">全部月份</option>` +
    set.map(m => `<option value="${m}">${m.slice(0,4)}年${m.slice(5,7)}月</option>`).join("");
  if (cur && (cur === "" || set.includes(cur))) $("month").value = cur;
}

/* ---------- 畫面 ---------- */
function render() {
  const kw = $("q").value.trim().toLowerCase();
  const mo = $("month").value;

  let view = rows.filter(r => {
    if (mo && !r.spend_date.startsWith(mo)) return false;
    if (filter === "unpaid" && r.claimed) return false;
    if (filter === "receipt" && !r.receipt_path) return false;
    if (kw && !((r.item || "") + " " + (r.note || "")).toLowerCase().includes(kw)) return false;
    return true;
  });

  const unpaid = rows.filter(r => !r.claimed);
  $("unpaid").textContent = nt(unpaid.reduce((s, r) => s + Number(r.amount), 0));
  $("unpaidN").textContent = unpaid.length;

  const scope = mo ? rows.filter(r => r.spend_date.startsWith(mo)) : rows;
  $("mLabel").textContent = mo ? `${mo.slice(5,7)}月支出` : "全部支出";
  $("mTotal").textContent = nt(scope.reduce((s, r) => s + Number(r.amount), 0));

  if (!view.length) {
    $("list").innerHTML = rows.length
      ? `<div class="empty"><div>🔍</div><div>這個條件下沒有帳</div></div>`
      : `<div class="empty"><div>🧾</div><div>還沒有任何一筆，按右下角記第一筆</div></div>`;
    return;
  }

  let html = "", lastM = "";
  for (const r of view) {
    const m = r.spend_date.slice(0, 7);
    if (m !== lastM) {
      lastM = m;
      const sum = view.filter(x => x.spend_date.startsWith(m)).reduce((s, x) => s + Number(x.amount), 0);
      html += `<div class="mgroup"><h2>${m.slice(0,4)}年${m.slice(5,7)}月</h2><hr><em class="mono">NT$${nt(sum)}</em></div>`;
    }
    const d = r.spend_date.split("-");
    html += `
    <div class="stub ${r.claimed ? "paid" : ""}">
      <div class="stub-top">
        <div>
          <div class="stub-date mono">${d[0]}.${d[1]}.${d[2]}</div>
          <div class="stub-item">${esc(r.item)}</div>
          ${r.note ? `<div class="stub-note">${esc(r.note)}</div>` : ""}
        </div>
        <div class="stub-amt mono">${nt(r.amount)}</div>
      </div>
      <div class="stub-bot">
        ${r.receipt_path ? `<button class="tag recp" data-view="${esc(r.receipt_path)}">🧾 看收據</button>` : ""}
        <button class="tag pay ${r.claimed ? "on" : ""}" data-toggle="${r.id}">
          ${r.claimed ? "✓ 已請款" : "○ 未請款"}
        </button>
        <button class="tag edit" data-edit="${r.id}">編輯</button>
      </div>
      ${r.claimed ? `<div class="stamp">已請款<span>PAID</span></div>` : ""}
    </div>`;
  }
  $("list").innerHTML = html;
}

$("list").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.view) showReceipt(b.dataset.view);
  if (b.dataset.toggle) togglePaid(b.dataset.toggle);
  if (b.dataset.edit) openSheet(rows.find(r => r.id === b.dataset.edit));
};
$("q").oninput = render;
$("month").onchange = render;
for (const [id, val] of [["cAll","all"],["cUnpaid","unpaid"],["cRecp","receipt"]]) {
  $(id).onclick = () => {
    filter = val;
    for (const x of ["cAll","cUnpaid","cRecp"]) $(x).setAttribute("aria-pressed", "false");
    $(id).setAttribute("aria-pressed", "true");
    render();
  };
}

/* ---------- 打勾 ---------- */
async function togglePaid(id) {
  const r = rows.find(x => x.id === id);
  const now = !r.claimed;
  r.claimed = now; r.claimed_at = now ? new Date().toISOString() : null;
  render();
  const { error } = await sb.from("expenses")
    .update({ claimed: now, claimed_at: r.claimed_at }).eq("id", id);
  if (error) { toast("存不起來：" + error.message); load(); }
  else toast(now ? "標記為已請款" : "改回未請款");
}

/* ---------- 收據 ---------- */
async function showReceipt(path) {
  toast("開啟收據…");
  const { data, error } = await sb.storage.from("receipts").createSignedUrl(path, 120);
  if (error) return toast("讀不到收據：" + error.message);
  $("vImg").src = data.signedUrl;
  $("viewer").classList.add("on");
}
$("vClose").onclick = () => $("viewer").classList.remove("on");
$("viewer").onclick = e => { if (e.target.id === "viewer") $("viewer").classList.remove("on"); };

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("圖片轉檔失敗")), "image/jpeg", 0.82);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error("這個檔案不是圖片"));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- 表單 ---------- */
function openSheet(r) {
  editing = r || null;
  pendingFile = null; removeReceipt = false;
  $("sheetTitle").textContent = r ? "編輯這筆" : "記一筆";
  $("f_date").value = r ? r.spend_date : new Date().toLocaleDateString("sv-SE");
  $("f_item").value = r ? r.item : "";
  $("f_amount").value = r ? r.amount : "";
  $("f_note").value = r ? (r.note || "") : "";
  $("f_claimed").checked = r ? r.claimed : false;
  $("del").style.display = r ? "block" : "none";
  $("prev").style.display = "none"; $("prevImg").src = "";
  $("drop").textContent = r && r.receipt_path ? "🧾 已有收據，點這裡換一張" : "📷 點這裡拍照或選圖片";
  $("save").disabled = false; $("save").textContent = "儲存";
  $("sheet").classList.add("on");
}
$("fab").onclick = () => openSheet(null);
for (const el of document.querySelectorAll("[data-close]")) el.onclick = () => $("sheet").classList.remove("on");

$("drop").onclick = () => $("f_file").click();
$("f_file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    pendingFile = await shrink(f);
    removeReceipt = false;
    $("prevImg").src = URL.createObjectURL(pendingFile);
    $("prev").style.display = "block";
    $("drop").textContent = "📷 換一張";
  } catch (err) { toast(err.message); }
  e.target.value = "";
};
$("rmImg").onclick = () => {
  pendingFile = null; removeReceipt = true;
  $("prev").style.display = "none";
  $("drop").textContent = "📷 點這裡拍照或選圖片";
};

$("save").onclick = async () => {
  const date = $("f_date").value;
  const item = $("f_item").value.trim();
  const amt = Number($("f_amount").value);
  if (!date) return toast("先選日期");
  if (!item) return toast("內容要填一下");
  if (!amt) return toast("金額要填一下");

  $("save").disabled = true; $("save").textContent = "儲存中…";
  const claimed = $("f_claimed").checked;
  const rec = {
    spend_date: date, item, amount: amt,
    note: $("f_note").value.trim() || null,
    claimed, claimed_at: claimed ? (editing?.claimed_at || new Date().toISOString()) : null
  };

  try {
    let oldPath = editing?.receipt_path || null;
    if (pendingFile) {
      const p = `${crypto.randomUUID()}.jpg`;
      const { error } = await sb.storage.from("receipts")
        .upload(p, pendingFile, { contentType: "image/jpeg" });
      if (error) throw error;
      rec.receipt_path = p;
    } else if (removeReceipt) {
      rec.receipt_path = null;
    }

    if (editing) {
      const { error } = await sb.from("expenses").update(rec).eq("id", editing.id);
      if (error) throw error;
      if (oldPath && rec.receipt_path !== undefined && rec.receipt_path !== oldPath)
        await sb.storage.from("receipts").remove([oldPath]);
    } else {
      const { error } = await sb.from("expenses").insert(rec);
      if (error) throw error;
    }
    $("sheet").classList.remove("on");
    toast(editing ? "改好了" : "記好了");
    await load();
  } catch (err) {
    toast("存不進去：" + (err.message || err));
  } finally {
    $("save").disabled = false; $("save").textContent = "儲存";
  }
};

$("del").onclick = async () => {
  if (!editing || !confirm(`確定刪除「${editing.item}」？刪掉就找不回來了`)) return;
  const { error } = await sb.from("expenses").delete().eq("id", editing.id);
  if (error) return toast("刪不掉：" + error.message);
  if (editing.receipt_path) await sb.storage.from("receipts").remove([editing.receipt_path]);
  $("sheet").classList.remove("on");
  toast("已刪除");
  load();
};

let tid;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("on");
  clearTimeout(tid);
  tid = setTimeout(() => $("toast").classList.remove("on"), 2200);
}
</script>
</body>
</html>
