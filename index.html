<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>淡水國際同濟會 第28屆</title>
<style>
:root{
  --blue:#003974;--gold:#B8975B;--gold-d:#8C6F38;--gold-lt:#E7D4AC;
  --cream:#FAF2E0;--cream-2:#F3E6C9;--card:#FFFDF7;--line:#E8D9B8;
  --ink:#3B2E17;--ink-soft:#8A7855;
}
html{background:var(--cream);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:60px}
header{background:linear-gradient(180deg,var(--cream-2),var(--cream));position:sticky;top:0;z-index:20;
  padding:14px 16px 0;border-bottom:1px solid var(--gold-lt)}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:42px;height:42px;border-radius:50%;flex:0 0 42px;border:2.5px solid var(--gold);
  display:grid;place-items:center;font-weight:800;font-size:21px;color:var(--blue);background:#FFF8E8}
.brand h1{font-size:16.5px;margin:0;font-weight:700;color:var(--blue)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-soft)}
.back{background:none;border:0;font-family:inherit;font-size:13px;color:var(--ink-soft);
  padding:0 0 10px;cursor:pointer;display:none}
.tabs{display:flex;margin-top:12px;gap:2px}
.tab{flex:1;text-align:center;padding:11px 4px 9px;border:0;cursor:pointer;background:transparent;
  color:var(--ink-soft);font-size:14.5px;font-weight:600;font-family:inherit;border-bottom:3px solid transparent}
.tab.on{color:var(--blue);border-bottom-color:var(--gold)}
.tab small{display:block;font-size:11px;font-weight:400;margin-top:2px;opacity:.85}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar .big{font-size:22px;font-weight:800;color:var(--blue)}
.bar .lab{font-size:12.5px;color:var(--ink-soft)}
.track{height:8px;border-radius:99px;background:var(--cream-2);margin-top:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--gold-lt),var(--gold));width:0;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input[type=text],input[type=number],input[type=password]{font-family:inherit;font-size:15px;padding:9px 11px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--blue);cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#fff}
.btn:disabled{opacity:.5}
.search{flex:1}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 4px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lockbox{display:flex;gap:8px;align-items:center;margin-bottom:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lockbox .txt{flex:1;font-size:13px;color:var(--ink-soft)}
.lockbox input{width:96px}
h2.grp{font-size:13.5px;letter-spacing:2px;color:var(--gold-d);margin:18px 4px 8px;
  display:flex;align-items:center;gap:8px;font-weight:700}
h2.grp::after{content:"";flex:1;height:1px;background:var(--gold-lt)}
h2.grp em{font-style:normal;font-size:12px;color:var(--gold-d);opacity:.75;letter-spacing:0}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  margin-bottom:8px;display:flex;align-items:center;gap:12px}
.item.done{border-color:var(--gold);background:#FBF1DC}
.who{flex:1;min-width:0}
.who .name{font-size:16.5px;font-weight:600;color:var(--blue)}
.who .title{font-size:12px;color:var(--ink-soft);margin-top:1px}
.chk{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:2px solid var(--gold-lt);background:#fff;
  cursor:pointer;display:grid;place-items:center;font-size:19px;color:transparent;font-weight:800}
.chk.on{background:var(--gold);border-color:var(--gold-d);color:#fff}
.chk.ro{cursor:default;border-style:dashed}
.chk.ro.on{border-style:solid;opacity:.85}
.money{width:100px;flex:0 0 100px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.money::-webkit-outer-spin-button,.money::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.moneyRO{width:100px;flex:0 0 100px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-soft)}
.empty{background:var(--card);border:1px dashed var(--gold);border-radius:12px;padding:26px 16px;
  text-align:center;color:var(--ink-soft);font-size:14.5px}
.foot{text-align:center;font-size:12px;color:var(--ink-soft);padding:24px 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--blue);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 登入 */
.gate{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#F3E6C9,#FAF2E0);
  display:grid;place-items:center;padding:24px}
.gate .box{width:100%;max-width:320px;text-align:center}
.gate .seal{width:76px;height:76px;font-size:38px;margin:0 auto 18px;border-width:3px}
.gate h2{font-size:21px;color:var(--blue);margin:0 0 4px;font-weight:700}
.gate p{font-size:13px;color:var(--ink-soft);margin:0 0 22px}
.gate input{width:100%;text-align:center;font-size:17px;padding:13px;letter-spacing:4px;margin-bottom:10px}
.gate button{width:100%;padding:13px;font-size:16px}
.gate .err{font-size:13px;color:#B4453A;height:18px;margin-top:8px}
/* 選單 */
.menu{max-width:420px;margin:30px auto;padding:0 16px}
.menu .mtitle{text-align:center;font-size:17px;color:var(--blue);font-weight:700;margin-bottom:20px}
.mcard{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:18px 16px;
  margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;
  font-family:inherit;text-align:left}
.mcard .ic{font-size:26px;line-height:1}
.mcard .mt{font-size:16.5px;color:var(--blue);font-weight:600}
.mcard .ms{font-size:12px;color:var(--ink-soft);margin-top:2px}
/* 通訊錄 */
.dirhead{font-size:15.5px;color:var(--blue);font-weight:700;line-height:1.4;margin:2px 4px 2px}
.dirsub{font-size:11.5px;color:var(--ink-soft);margin:0 4px 12px}
.note{background:var(--cream-2);border-left:4px solid var(--gold);padding:11px 13px;margin-bottom:12px;
  font-size:13px;color:var(--gold-d);border-radius:0 8px 8px 0}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.pc .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pc .nm{font-size:16.5px;font-weight:600;color:var(--blue)}
.pc .cb{font-size:11px;color:var(--gold-d);background:var(--cream-2);border-radius:99px;padding:2px 8px}
.pc .tt{font-size:12px;color:var(--ink-soft)}
.pc a{display:block;margin-top:6px;font-size:14.5px;color:var(--gold-d);text-decoration:none;word-break:break-all}
.pc .na{display:block;margin-top:6px;font-size:13px;color:#C3B596}
.pc .ad{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
.cbline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);margin:0 4px 12px}
.up{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.up h3{margin:0 0 3px;font-size:14.5px;color:var(--blue)}
.up p{margin:0 0 11px;font-size:12px;color:var(--ink-soft)}
.ver{background:var(--cream);border:1px solid var(--gold-lt);border-radius:10px;padding:9px 11px;
  font-size:12.5px;color:var(--ink-soft);margin-bottom:10px}
.ver b{display:block;font-size:15px;color:var(--blue);font-weight:600}
@media print{header,.tools,.chips,.lockbox,.btn,.toast,.up{display:none}body{background:#fff;padding:0}}
</style>
</head>
<body>

<header id="hd" style="display:none">
  <button class="back" id="backBtn">← 返回選單</button>
  <div class="brand">
    <div class="seal">K</div>
    <div>
      <h1 id="hTitle">淡水國際同濟會　第28屆</h1>
      <p id="hSub">2026–2027年　會務追蹤表</p>
    </div>
  </div>
  <div class="tabs" id="clubTabs" style="display:none">
    <button class="tab on" data-tab="fee">會費繳交<small id="tb1">—</small></button>
    <button class="tab" data-tab="tie">領帶領取<small id="tb2">—</small></button>
    <button class="tab" data-tab="award">會內敘獎<small id="tb3">—</small></button>
  </div>
  <div class="tabs" id="dirTabs" style="display:none">
    <button class="tab on" data-dtab="區職人員">區職人員<small id="db1">—</small></button>
    <button class="tab" data-dtab="分會六長">分會六長<small id="db2">—</small></button>
  </div>
</header>

<div class="gate" id="gate">
  <div class="box">
    <div class="seal">K</div>
    <h2>淡水國際同濟會</h2>
    <p>第28屆　2026–2027</p>
    <input type="password" id="gpw" inputmode="numeric" placeholder="輸入密碼" autocomplete="off">
    <button class="btn gold" id="goBtn">開啟</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<div class="menu" id="menu" style="display:none">
  <div class="mtitle">請選擇要查看的項目</div>
  <button class="mcard" data-go="club">
    <span class="ic">📋</span>
    <span><span class="mt">會務資訊</span><span class="ms">會費・領帶・敘獎</span></span>
  </button>
  <button class="mcard" data-go="dir">
    <span class="ic">📇</span>
    <span><span class="mt">通訊錄</span><span class="ms">區職人員・分會六長</span></span>
  </button>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="lockbox" id="lockbox">
    <span class="txt" id="lockTxt">檢視模式・輸入密碼可編輯</span>
    <input type="password" id="pw" inputmode="numeric" placeholder="密碼" autocomplete="off">
    <button class="btn gold" id="unlockBtn">解鎖</button>
    <button class="btn" id="lockBtn" style="display:none">鎖定</button>
  </div>

  <!-- 會務資訊 -->
  <div id="clubView">
    <div class="bar">
      <div class="row"><span class="lab" id="statLab">—</span><span class="big" id="statBig">—</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="chips">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="todo" id="chipTodo">未完成</button>
      <button class="chip" data-f="done" id="chipDone">已完成</button>
    </div>
    <div class="tools">
      <input type="text" class="search" id="q" placeholder="搜尋姓名或職稱…">
      <button class="btn" id="copyBtn">複製未完成</button>
      <button class="btn" id="csvBtn">匯出 CSV</button>
    </div>
    <div class="tools" id="feeTools" style="display:none">
      <input type="number" id="defAmt" value="3000" step="100" style="width:110px">
      <button class="btn gold" id="applyAll">套用金額到全部</button>
      <button class="btn" id="applyEmpty">只套用空白的</button>
    </div>
    <div id="list"></div>
  </div>

  <!-- 通訊錄 -->
  <div id="dirView" style="display:none">
    <div class="dirhead">第53屆 2026–2027<br>北一區區職人員名冊</div>
    <div class="dirsub" id="dirSub">讀取中…</div>
    <div class="note" id="dirNote" style="display:none"></div>

    <div class="up" id="upBox" style="display:none">
      <h3>更新通訊錄</h3>
      <p>上傳維護用的 Excel，覆蓋現有名冊</p>
      <div class="ver" id="verBox">目前線上版本：尚未同步</div>
      <div class="tools">
        <input type="file" id="xlsFile" accept=".xlsx,.xls" style="font-size:13px;flex:1">
      </div>
      <div class="tools">
        <button class="btn gold" id="upBtn" disabled>確認更新</button>
        <button class="btn" id="dlBtn">下載目前名冊 Excel</button>
      </div>
    </div>

    <div class="tools">
      <input type="text" class="search" id="dq" placeholder="搜尋姓名・會別・職稱…">
    </div>
    <label class="cbline"><input type="checkbox" id="showAddr"> 顯示地址</label>
    <div id="dlist"></div>
  </div>

  <div class="foot">資料儲存於 Supabase，多人即時同步。</div>
</div>

<div class="toast" id="toast"></div>

let M=[],C=[],META={},view="menu",tab="fee",filt="all",dtab="區職人員",unlocked=false,pending=null;
const WORD={fee:{todo:"未繳",done:"已繳",list:"尚未繳交會費"},
            tie:{todo:"未領",done:"已領",list:"尚未領取領帶"},
            award:{todo:"未領",done:"已領",list:"尚未領取敘獎禮品"}};
const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800);}
function roc(d){const x=new Date(d);return (x.getFullYear()-1911)+"/"+String(x.getMonth()+1).padStart(2,"0")+"/"
  +String(x.getDate()).padStart(2,"0")+" "+String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0");}

/* ---------- 載入 ---------- */
async function boot(){
  try{
    let {data,error}=await db.from(T_M).select("*").order("sort_no");
    if(error)throw error;
    if(!data||!data.length){
      const rows=SEED_M.map((r,i)=>({sort_no:i+1,grp:r[0],title:r[1],name:r[2],
        fee_amount:0,fee_paid:false,tie_received:!!r[3],award_received:!!r[4]}));
      await db.from(T_M).insert(rows);
      data=(await db.from(T_M).select("*").order("sort_no")).data;
    }
    M=data;
    let c=await db.from(T_C).select("*").order("id");
    if(!c.data||!c.data.length){
      await db.from(T_C).insert(SEED_C);
      c=await db.from(T_C).select("*").order("id");
      await setMeta("contacts_updated",new Date().toISOString());
      await setMeta("contacts_count",String(SEED_C.length));
      await setMeta("contacts_file","北一區通訊錄_維護用.xlsx（初始匯入）");
    }
    C=c.data||[];
    const mt=await db.from(T_X).select("*");
    (mt.data||[]).forEach(r=>META[r.k]=r.v);
    db.channel("kiwanis").on("postgres_changes",{event:"*",schema:"public",table:T_M},p=>{
      const r=p.new;if(!r)return;const i=M.findIndex(x=>x.id===r.id);
      if(i>=0)M[i]=r;else M.push(r);M.sort((a,b)=>a.sort_no-b.sort_no);if(view==="club")render();
    }).subscribe();
    $("menu").style.display="block";
  }catch(e){
    $("gerr").textContent="連線失敗："+(e.message||e);
    $("gate").style.display="grid";
  }
}
async function setMeta(k,v){
  META[k]=v;
  await db.from(T_X).upsert({k,v,updated_at:new Date().toISOString()},{onConflict:"k"});
}

/* ---------- 畫面切換 ---------- */
function go(v){
  view=v;
  $("menu").style.display=v==="menu"?"block":"none";
  $("app").style.display=v==="menu"?"none":"block";
  $("hd").style.display=v==="menu"?"none":"block";
  $("backBtn").style.display=v==="menu"?"none":"block";
  $("clubView").style.display=v==="club"?"block":"none";
  $("dirView").style.display=v==="dir"?"block":"none";
  $("clubTabs").style.display=v==="club"?"flex":"none";
  $("dirTabs").style.display=v==="dir"?"flex":"none";
  $("hTitle").textContent=v==="dir"?"北一區通訊錄":"淡水國際同濟會　第28屆";
  $("hSub").textContent=v==="dir"?"第53屆　2026–2027":"2026–2027年　會務追蹤表";
  if(v==="club")render(); if(v==="dir")renderDir();
}
document.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("backBtn").onclick=()=>go("menu");

/* ---------- 會務資訊 ---------- */
async function push(row,patch){
  Object.assign(row,patch);render();
  const {error}=await db.from(T_M).update(Object.assign({},patch,{updated_at:new Date().toISOString()})).eq("id",row.id);
  if(error)toast("儲存失敗，請重試");
}
function done(m){return tab==="fee"?m.fee_paid:(tab==="tie"?m.tie_received:m.award_received);}
function toggle(m){const k=tab==="fee"?"fee_paid":(tab==="tie"?"tie_received":"award_received");push(m,{[k]:!m[k]});}
const timers={};
function setAmt(m,v){m.fee_amount=v===""?0:+v;stats();clearTimeout(timers[m.id]);
  timers[m.id]=setTimeout(()=>push(m,{fee_amount:m.fee_amount}),500);}

function render(){
  const q=$("q").value.trim(),w=WORD[tab];
  $("chipTodo").textContent=w.todo;$("chipDone").textContent=w.done;
  $("copyBtn").textContent=filt==="done"?"複製已完成":"複製未完成";
  const isFee=tab==="fee";
  $("feeTools").style.display=(isFee&&unlocked)?"flex":"none";
  const list=$("list");list.innerHTML="";let shown=0;
  ["幹部","歷屆會長","會兄"].forEach(g=>{
    const all=M.filter(m=>m.grp===g);
    const rows=all.filter(m=>(!q||(m.name||"").includes(q)||(m.title||"").includes(q))
      &&(filt==="all"||(filt==="todo"?!done(m):done(m))));
    if(!rows.length)return;shown+=rows.length;
    const h=document.createElement("h2");h.className="grp";
    h.innerHTML=g+' <em>'+(filt==="all"?all.filter(done).length+' / '+all.length:rows.length+' 人')+'</em>';
    list.appendChild(h);
    rows.forEach(m=>{
      const d=done(m),el=document.createElement("div");el.className="item"+(d?" done":"");
      el.innerHTML='<div class="who"><div class="name">'+m.name+'</div><div class="title">'+m.title+'</div></div>';
      if(isFee){
        if(unlocked){const inp=document.createElement("input");inp.type="number";inp.className="money";
          inp.placeholder="金額";inp.step="100";inp.value=m.fee_amount||"";inp.oninput=()=>setAmt(m,inp.value);el.appendChild(inp);}
        else{const sp=document.createElement("div");sp.className="moneyRO";
          sp.textContent=m.fee_amount?"$"+(+m.fee_amount).toLocaleString():"";el.appendChild(sp);}
      }
      const b=document.createElement("button");b.className="chk"+(d?" on":"");b.textContent="✓";
      if(unlocked)b.onclick=()=>toggle(m);
      else{b.classList.add("ro");b.onclick=()=>toast("需輸入編輯密碼才能修改");}
      el.appendChild(b);list.appendChild(el);
    });
  });
  if(!shown){const e=document.createElement("div");e.className="empty";
    e.textContent=q?"找不到「"+q+"」":(filt==="todo"?"全部都完成了 🎉":"目前還沒有人完成");list.appendChild(e);}
  stats();
}
function stats(){
  const N=M.length||1;
  const t1=M.filter(m=>m.fee_paid).length,t2=M.filter(m=>m.tie_received).length,t3=M.filter(m=>m.award_received).length;
  $("tb1").textContent=t1+"/"+M.length;$("tb2").textContent=t2+"/"+M.length;$("tb3").textContent=t3+"/"+M.length;
  let n,lab;
  if(tab==="fee"){n=t1;
    if(unlocked){const due=M.reduce((s,m)=>s+(+m.fee_amount||0),0),got=M.reduce((s,m)=>s+(m.fee_paid?(+m.fee_amount||0):0),0);
      lab="應收 $"+due.toLocaleString()+"　已收 $"+got.toLocaleString()+"　未收 $"+(due-got).toLocaleString();}
    else lab="已繳會費人數";
  }else if(tab==="tie"){n=t2;lab="已領取領帶";}else{n=t3;lab="已領取敘獎禮品";}
  $("statLab").textContent=lab;$("statBig").textContent=n+" / "+M.length+" 人";
  $("fill").style.width=(n/N*100)+"%";
}

/* ---------- 通訊錄 ---------- */
function renderDir(){
  const q=$("dq").value.trim(),showAddr=$("showAddr").checked;
  const named=C.filter(c=>c.name);
  $("db1").textContent=named.filter(c=>c.cat==="區職人員").length+" 人";
  $("db2").textContent=named.filter(c=>c.cat==="分會六長").length+" 人";
  const upd=META.contacts_updated?roc(META.contacts_updated):"—";
  $("dirSub").textContent="資料更新於 "+upd+"・共 "+named.length+" 人";
  $("verBox").innerHTML="目前線上版本<b>"+upd+"</b>"+named.length+" 人・"+(META.contacts_file||"—");
  $("upBox").style.display=unlocked?"block":"none";

  const rows=named.filter(c=>c.cat===dtab&&(!q||[c.name,c.club,c.title].join("").includes(q)));
  const box=$("dlist");box.innerHTML="";
  if(!rows.length){box.innerHTML='<div class="empty">'+(q?"找不到「"+q+"」":"沒有資料")+'</div>';return;}
  const groups=dtab==="分會六長"?[...new Set(rows.map(c=>c.club))]:[""];
  groups.forEach(g=>{
    const sub=dtab==="分會六長"?rows.filter(c=>c.club===g):rows;
    if(g){const h=document.createElement("h2");h.className="grp";
      h.innerHTML=g+'會 <em>'+sub.length+' 人</em>';box.appendChild(h);}
    sub.forEach(c=>{
      const el=document.createElement("div");el.className="pc";
      let s='<div class="l1"><span class="nm">'+c.name+'</span>';
      if(c.club)s+='<span class="cb">'+c.club+'</span>';
      s+='<span class="tt">'+(c.title||"")+'</span></div>';
      s+=c.phone?'<a href="tel:'+c.phone.replace(/[^0-9+]/g,"")+'">📞 '+c.phone+'</a>':'<span class="na">📞 未提供</span>';
      s+=c.email?'<a href="mailto:'+c.email+'">✉️ '+c.email+'</a>':'<span class="na">✉️ 未提供</span>';
      if(showAddr&&c.addr)s+='<div class="ad">📍 '+c.addr+'</div>';
      if(c.note)s+='<div class="ad" style="color:#A8622F">⚠ '+c.note+'</div>';
      el.innerHTML=s;box.appendChild(el);
    });
  });
}

/* 讀 Excel */
$("xlsFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
      const ws=wb.Sheets["通訊錄"]||wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let hi=aoa.findIndex(r=>r.includes("姓名")&&r.includes("職稱"));
      if(hi<0)throw new Error("找不到欄位名稱列（需含『職稱』『姓名』）");
      const H=aoa[hi].map(x=>String(x).trim());
      const ix=n=>H.indexOf(n);
      const out=[];
      for(let i=hi+1;i<aoa.length;i++){
        const r=aoa[i];if(!r||!String(r[ix("姓名")]||"").trim())continue;
        out.push({cat:String(r[ix("類別")]||"").trim(),seq:+r[ix("序")]||0,
          club:String(r[ix("會別")]||"").trim(),title:String(r[ix("職稱")]||"").trim(),
          name:String(r[ix("姓名")]||"").trim(),phone:String(r[ix("行動電話")]||"").trim(),
          email:String(r[ix("Email")]||"").trim(),addr:String(r[ix("地址")]||"").trim(),
          note:String(r[ix("備註")]||"").trim()});
      }
      if(!out.length)throw new Error("沒有讀到任何有姓名的資料");
      pending={rows:out,file:f.name};
      const a=out.filter(x=>x.cat==="區職人員").length,b=out.length-a,noP=out.filter(x=>!x.phone).length;
      $("dirNote").style.display="block";
      $("dirNote").textContent="讀取結果：區職人員 "+a+" 人、分會六長 "+b+" 人"+(noP?"，其中 "+noP+" 人缺電話（仍會匯入）":"")+"。按「確認更新」寫入。";
      $("upBtn").disabled=false;
    }catch(err){pending=null;$("upBtn").disabled=true;
      $("dirNote").style.display="block";$("dirNote").textContent="讀取失敗："+err.message;}
  };
  rd.readAsArrayBuffer(f);
};
$("upBtn").onclick=async()=>{
  if(!pending)return;
  if(!confirm("將以這份檔案覆蓋線上名冊（"+pending.rows.length+" 人），確定嗎？"))return;
  $("upBtn").disabled=true;$("upBtn").textContent="更新中…";
  try{
    const before=C.filter(c=>c.name).map(c=>c.name+"|"+c.phone);
    await db.from(T_C).delete().neq("id",0);
    for(let i=0;i<pending.rows.length;i+=200){
      const {error}=await db.from(T_C).insert(pending.rows.slice(i,i+200));
      if(error)throw error;
    }
    C=(await db.from(T_C).select("*").order("id")).data||[];
    const now=new Date().toISOString();
    await setMeta("contacts_updated",now);
    await setMeta("contacts_count",String(pending.rows.length));
    await setMeta("contacts_file",pending.file);
    const after=C.filter(c=>c.name).map(c=>c.name+"|"+c.phone);
    const add=after.filter(x=>!before.includes(x)).length,del=before.filter(x=>!after.includes(x)).length;
    $("dirNote").textContent="✅ 通訊錄已更新　"+roc(now)+"・"+after.length+" 人・新增或異動 "+add+" 筆、移除 "+del+" 筆";
    pending=null;$("xlsFile").value="";renderDir();toast("更新完成");
  }catch(e){$("dirNote").textContent="更新失敗："+(e.message||e);toast("更新失敗");}
  $("upBtn").textContent="確認更新";
};
$("dlBtn").onclick=()=>{
  const now=new Date(),stamp=roc(now);
  const head=["類別","序","會別","職稱","姓名","行動電話","Email","地址","備註"];
  const aoa=[["第53屆 2026-2027 北一區區職人員名冊・分會六長通訊錄"],
    ["※ 第3列為欄位名稱，此列請勿更動。　│　此檔版本："+stamp+" 由網頁下載"],head];
  C.forEach(c=>aoa.push([c.cat,c.seq||"",c.club,c.title,c.name,c.phone,c.email,c.addr,c.note]));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"通訊錄");
  const d=(now.getFullYear()-1911)+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0");
  XLSX.writeFile(wb,"北一區通訊錄_"+d+".xlsx");
};

  $("pw").style.display=unlocked?"none":"block";
  $("unlockBtn").style.display=unlocked?"none":"block";

}

};

$("csvBtn").onclick=()=>{
  let c="\uFEFF職稱,姓名,"+(unlocked?"會費金額,":"")+"會費已繳,領帶已領,敘獎已領\n";

async function signIn(){
  const el=$("gpw"),err=$("gerr"),btn=$("goBtn");
  if(!el.value){err.textContent="請輸入密碼";return;}
  btn.disabled=true;btn.textContent="開啟中…";err.textContent="";
  try{
    const key=await openVault(el.value,VA);
    db=supabase.createClient(SB_URL,key);
    $("gate").style.display="none";
    refreshLock();
    await boot();
  }catch(e){err.textContent="密碼錯誤";el.value="";}
  btn.disabled=false;btn.textContent="開啟";
}
